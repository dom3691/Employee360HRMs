# Render Blueprint — Employee360 HRMS API
# Docs: https://render.com/docs/blueprint-spec
#
# PostgreSQL: add a Render Postgres instance in the dashboard, then set
# ConnectionStrings__DefaultConnection (and optionally HangfireConnection) to the
# internal connection string. Hangfire can share the same database locally;
# use a separate DB on Render if you prefer isolation.

services:
  - type: web
    name: employee360-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: frankfurt
    healthCheckPath: /health
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Development
      - key: Hangfire__Enabled
        value: "false"
      - key: DemoData__Enabled
        value: "false"
      - key: Database__SeedOnStartup
        value: "true"
      - key: Swagger__Enabled
        value: "true"
      - key: ConnectionStrings__DefaultConnection
        sync: false
      - key: ConnectionStrings__HangfireConnection
        sync: false
      - key: Jwt__SigningKey
        generateValue: true
      - key: Encryption__Key
        generateValue: true
      - key: Cors__AllowedOrigins__0
        sync: false
