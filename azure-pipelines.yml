# Employee360 HRMS — Azure DevOps CI/CD (Batch 17)
# Build, test, EF migration bundle, deploy API + Angular to Azure App Service.
# Secrets: store in Azure Key Vault; pipeline reads via AzureKeyVault@2 task.

trigger:
  branches:
    include:
      - main
      - develop

pr:
  branches:
    include:
      - main
      - develop

variables:
  buildConfiguration: Release
  dotnetVersion: "8.0.x"
  apiProject: "src/Employee360.API/Employee360.API.csproj"
  infrastructureProject: "src/Employee360.Infrastructure/Employee360.Infrastructure.csproj"
  testProject: "tests/Employee360.UnitTests/Employee360.UnitTests.csproj"
  # Override in pipeline library or variable group for your environment.
  azureSubscription: "Employee360-Azure"
  apiAppServiceName: "employee360-api"
  webAppServiceName: "employee360-web"
  keyVaultName: "employee360-kv"
  angularProjectPath: "client/employee360-web" # set when Angular SPA is added

stages:
  - stage: Build
    displayName: Build & Test
    jobs:
      - job: BuildTest
        displayName: Build, test, publish
        pool:
          vmImage: ubuntu-latest
        steps:
          - task: UseDotNet@2
            displayName: Install .NET SDK
            inputs:
              packageType: sdk
              version: $(dotnetVersion)

          - task: AzureKeyVault@2
            displayName: Load secrets from Key Vault
            inputs:
              azureSubscription: $(azureSubscription)
              KeyVaultName: $(keyVaultName)
              SecretsFilter: "*"
              RunAsPreJob: true

          - script: dotnet restore Employee360.sln
            displayName: Restore NuGet packages

          - script: dotnet build Employee360.sln --configuration $(buildConfiguration) --no-restore
            displayName: Build solution

          - script: dotnet test $(testProject) --configuration $(buildConfiguration) --no-build --logger "trx;LogFileName=test-results.trx"
            displayName: Run unit tests

          - task: PublishTestResults@2
            displayName: Publish test results
            condition: succeededOrFailed()
            inputs:
              testResultsFormat: VSTest
              testResultsFiles: "**/test-results.trx"
              mergeTestResults: true

          - script: |
              dotnet ef migrations bundle \
                --project $(infrastructureProject) \
                --startup-project $(apiProject) \
                --output $(Build.ArtifactStagingDirectory)/efbundle \
                --self-contained \
                --configuration $(buildConfiguration)
            displayName: Create EF migration bundle
            env:
              ConnectionStrings__DefaultConnection: $(DefaultConnection)

          - script: dotnet publish $(apiProject) --configuration $(buildConfiguration) --output $(Build.ArtifactStagingDirectory)/api
            displayName: Publish API

          - script: |
              if [ -f "$(angularProjectPath)/angular.json" ]; then
                npm ci --prefix $(angularProjectPath)
                npm run build --prefix $(angularProjectPath) -- --configuration production
                cp -r $(angularProjectPath)/dist/* $(Build.ArtifactStagingDirectory)/web/
              else
                echo "Angular project not found at $(angularProjectPath); skipping SPA build."
                mkdir -p $(Build.ArtifactStagingDirectory)/web
                echo "<html><body><h1>Employee360 Web</h1><p>Deploy Angular SPA to this App Service.</p></body></html>" > $(Build.ArtifactStagingDirectory)/web/index.html
              fi
            displayName: Build Angular SPA (if present)

          - task: PublishBuildArtifacts@1
            displayName: Publish artifacts
            inputs:
              PathtoPublish: $(Build.ArtifactStagingDirectory)
              ArtifactName: drop

  - stage: Deploy
    displayName: Deploy to App Service
    dependsOn: Build
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - deployment: DeployApi
        displayName: Deploy API
        environment: production
        pool:
          vmImage: ubuntu-latest
        strategy:
          runOnce:
            deploy:
              steps:
                - task: AzureKeyVault@2
                  displayName: Load secrets from Key Vault
                  inputs:
                    azureSubscription: $(azureSubscription)
                    KeyVaultName: $(keyVaultName)
                    SecretsFilter: "*"

                - download: current
                  artifact: drop

                - script: |
                    chmod +x $(Pipeline.Workspace)/drop/efbundle
                    $(Pipeline.Workspace)/drop/efbundle --connection "$(DefaultConnection)"
                  displayName: Apply EF migrations
                  env:
                    ConnectionStrings__DefaultConnection: $(DefaultConnection)

                - task: AzureWebApp@1
                  displayName: Deploy API to App Service
                  inputs:
                    azureSubscription: $(azureSubscription)
                    appType: webAppLinux
                    appName: $(apiAppServiceName)
                    package: $(Pipeline.Workspace)/drop/api
                    runtimeStack: "DOTNETCORE|8.0"
                    appSettings: |
                      -ConnectionStrings__DefaultConnection $(DefaultConnection)
                      -ConnectionStrings__HangfireConnection $(HangfireConnection)
                      -Jwt__SigningKey @Microsoft.KeyVault(SecretUri=https://$(keyVaultName).vault.azure.net/secrets/JwtSigningKey/)
                      -Encryption__Key @Microsoft.KeyVault(SecretUri=https://$(keyVaultName).vault.azure.net/secrets/EncryptionKey/)
                      -AzureBlobStorage__ConnectionString @Microsoft.KeyVault(SecretUri=https://$(keyVaultName).vault.azure.net/secrets/BlobStorageConnectionString/)
                      -ApplicationInsights__ConnectionString $(ApplicationInsightsConnectionString)
                      -KeyVault__Uri https://$(keyVaultName).vault.azure.net/
                      -DemoData__Enabled false
                      -Hangfire__Enabled true

      - deployment: DeployWeb
        displayName: Deploy Angular SPA
        environment: production
        pool:
          vmImage: ubuntu-latest
        strategy:
          runOnce:
            deploy:
              steps:
                - download: current
                  artifact: drop

                - task: AzureWebApp@1
                  displayName: Deploy SPA to App Service
                  inputs:
                    azureSubscription: $(azureSubscription)
                    appType: webAppLinux
                    appName: $(webAppServiceName)
                    package: $(Pipeline.Workspace)/drop/web
